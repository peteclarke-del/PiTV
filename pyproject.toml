[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitv"
version = "0.1.0"
description = "PiTV: a 1980s UK television broadcaster for the Raspberry Pi 4"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10",
    "itsdangerous>=2",
]

[project.optional-dependencies]
pi = ["evdev>=1.6"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.16", "pytest-randomly>=3.15"]

[project.scripts]
pitv = "pitv.cli:main"

[tool.setuptools.packages.find]
include = ["pitv*"]

[tool.setuptools.package-data]
"pitv.web" = ["static/**/*"]
"pitv" = ["assets/*.mp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every run in a different order. A suite that has only ever run in one order cannot tell a test
# that passes from one that passes because of its neighbours: two here asserted nothing at all
# unless an earlier test had left the right state behind, and were green for months. The seed is
# printed at the top of each run, so a failure is reproducible with `-p randomly --randomly-seed=N`.

[tool.ruff]
line-length = 100
# The curated default rule set changed in 0.16; pinning the floor keeps "lint clean" meaning
# the same thing on every machine and in review.
required-version = ">=0.16"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and bodies as default arguments; these calls are evaluated
# per request by the framework, not once at import.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Header"]
